<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="The four-step-per-loop contract is capacity sensitive">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="72" y="42" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#152238">The four-step-per-loop contract is capacity sensitive</text>
<text x="72" y="68" font-family="system-ui,sans-serif" font-size="14" fill="#64748b">Median q=0.90 speed at demand 4. Longer training helps little; doubling width closes much of the gap.</text>
<line x1="130.0" x2="130.0" y1="100" y2="440" stroke="#dbe3ee"/>
<text x="130.0" y="464.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748b">0</text>
<line x1="306.2" x2="306.2" y1="100" y2="440" stroke="#dbe3ee"/>
<text x="306.2" y="464.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748b">1</text>
<line x1="482.4" x2="482.4" y1="100" y2="440" stroke="#dbe3ee"/>
<text x="482.4" y="464.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748b">2</text>
<line x1="658.6" x2="658.6" y1="100" y2="440" stroke="#dbe3ee"/>
<text x="658.6" y="464.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748b">3</text>
<line x1="834.8" x2="834.8" y1="100" y2="440" stroke="#dbe3ee"/>
<text x="834.8" y="464.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748b">4</text>
<text x="114.0" y="144.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#152238">paper target</text>
<rect x="130" y="126" width="704.8" height="34" rx="5" fill="#64748b"/>
<text x="846.8" y="149.0" text-anchor="start" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#64748b">4.00</text>
<text x="114.0" y="222.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#152238">small</text>
<rect x="130" y="204" width="312.0" height="34" rx="5" fill="#2563eb"/>
<text x="454.0" y="227.0" text-anchor="start" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#2563eb">1.77</text>
<text x="114.0" y="300.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#152238">small + longer dwell</text>
<rect x="130" y="282" width="354.3" height="34" rx="5" fill="#2563eb"/>
<text x="496.3" y="305.0" text-anchor="start" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#2563eb">2.01</text>
<text x="114.0" y="378.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#152238">medium width</text>
<rect x="130" y="360" width="593.2" height="34" rx="5" fill="#ea580c"/>
<text x="735.2" y="383.0" text-anchor="start" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ea580c">3.37</text>
<text x="500.0" y="496.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#152238">measured convergence speed</text>
