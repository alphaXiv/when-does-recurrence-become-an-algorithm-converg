apiVersion: batch/v1
kind: Job
metadata:
  name: looped-s4-{{ORX_RUN}}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OMP_NUM_THREADS
              value: "8"
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "40"
              memory: "192Gi"
            limits:
              nvidia.com/gpu: "4"
              cpu: "40"
              memory: "192Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "32Gi"
